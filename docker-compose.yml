services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: gymtracker
      POSTGRES_PASSWORD: gymtracker
      POSTGRES_DB: gymtracker
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymtracker"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db_data:
